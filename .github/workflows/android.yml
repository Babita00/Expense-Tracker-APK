name: Build Android APK

# Manual runs, plus a build on every push to main so there is always a
# downloadable APK for the latest code.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Needed to publish the APK as a release.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the web bundle
        run: npm run build

      - name: Copy the bundle into the Android project
        run: npx cap sync android

      - name: Assemble the debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK for humans
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kharcha.apk
          ls -lh out/kharcha.apk

      # The artifact is a zip, which is awkward to open on a phone. Keep it for
      # history, but the release below is the one to install from.
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: out/kharcha.apk
          if-no-files-found: error
          retention-days: 90

      # A release gives a direct .apk link, so the phone downloads the file
      # itself rather than a zip that needs extracting.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          **On your phone:** tap `kharcha.apk` below to download it, then open the
          downloaded file to install. Android will ask you to allow installing from
          this source - that is expected for any app not from the Play Store.

          Installing over an existing Kharcha keeps your recorded expenses.
          Uninstalling first wipes them, so take a backup from Settings before you do.
          NOTES
          echo "" >> release-notes.md
          echo "Debug build from commit ${{ github.sha }}." >> release-notes.md

          gh release create "build-${{ github.run_number }}" out/kharcha.apk \
            --title "Kharcha build ${{ github.run_number }}" \
            --notes-file release-notes.md
